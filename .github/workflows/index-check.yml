name: Index Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-index:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate index
        shell: powershell
        run: .\tools\update_acm_index.ps1

      - name: Diagnose
        if: always()
        shell: powershell
        run: |
          echo "=== git status ==="
          git status --porcelain
          echo "=== csv BOM/CR ==="
          $p = (Resolve-Path problem-notes.csv).Path
          $b = [System.IO.File]::ReadAllBytes($p)
          echo ("BOM=" + ($b[0] -eq 239 -and $b[1] -eq 187 -and $b[2] -eq 191))
          echo ("CR=" + ($b | Where-Object {$_ -eq 13}).Count
          echo "=== diff ignoring CR (empty = only line endings) ==="
          git diff --ignore-cr-at-eol problem-notes.csv
          echo "=== diff stat ==="
          git diff --stat problem-notes.csv

      - name: Verify problem-notes.csv is up to date
        shell: powershell
        run: |
          $changed = git status --porcelain problem-notes.csv
          if ($changed) {
            echo "::error::problem-notes.csv is out of date. Run tools/update_acm_index.ps1 and commit the result."
            git diff problem-notes.csv
            exit 1
          }
          echo "Index is up to date."
