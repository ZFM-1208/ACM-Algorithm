name: Index Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-index:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report fresh checkout state
        shell: powershell
        run: |
          $p = (Resolve-Path problem-notes.csv).Path
          $b = [System.IO.File]::ReadAllBytes($p)
          $bom = ($b[0] -eq 239 -and $b[1] -eq 187 -and $b[2] -eq 191)
          $cr = ($b | Where-Object {$_ -eq 13}).Count
          $auto = git config --get core.autocrlf
          echo "::warning title=FRESH::autocrlf=$auto BOM=$bom CR=$cr"
          exit 0

      - name: Regenerate index
        shell: powershell
        run: .\tools\update_acm_index.ps1

      - name: Report after-regenerate state
        shell: powershell
        run: |
          $p = (Resolve-Path problem-notes.csv).Path
          $b = [System.IO.File]::ReadAllBytes($p)
          $bom = ($b[0] -eq 239 -and $b[1] -eq 187 -and $b[2] -eq 191)
          $cr = ($b | Where-Object {$_ -eq 13}).Count
          echo "::warning title=AFTER::BOM=$bom CR=$cr"
          $st = (git status --porcelain problem-notes.csv) -join ' ; '
          echo "::warning title=STATUS::$st"
          $ign = (git diff --ignore-cr-at-eol problem-notes.csv | Measure-Object -Line).Lines
          echo "::warning title=DIFF_IGNORE_CR_LINES::$ign"
          $dd = (git diff problem-notes.csv | Select-Object -First 6) -join ' || '
          echo "::warning title=DIFFHEAD::$dd"
          exit 0

      - name: Verify problem-notes.csv is up to date
        shell: powershell
        run: |
          $changed = git status --porcelain problem-notes.csv
          if ($changed) {
            echo "::error::problem-notes.csv is out of date. Run tools/update_acm_index.ps1 and commit the result."
            git diff problem-notes.csv
            exit 1
          }
          echo "Index is up to date."
